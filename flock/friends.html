<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Друзья — Flock</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="wrap">
        <div class="header">
            <div class="logo">🕊️ Flock</div>
            <div class="nav">
                <a href="index.html">Главная</a>
                <a href="profile.html">Мой профиль</a>
                <a href="friends.html"><b>Друзья</b></a>
            </div>
            <div class="user-info">
                <span id="userName">Загрузка...</span>
                <a href="#" onclick="logout()" style="color:#ff8888;">[Выйти]</a>
            </div>
        </div>

        <div class="content">
            <div class="col-center" style="width:100%;">
                <h2>👥 Мои друзья</h2>
                <div id="allFriends"></div>
            </div>
        </div>
    </div>

    <script type="module">
        import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
        import { doc, getDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
        import { auth, db } from './js/firebase-config.js';
        import { logout } from './js/auth.js';
        import { getAllFriends } from './js/friends.js';

        window.logout = logout;

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const userDoc = await getDoc(doc(db, 'users', user.uid));
                document.getElementById('userName').textContent = userDoc.data().name;
                getAllFriends(user.uid);
            } else {
                window.location.href = 'login.html';
            }
        });
    </script>
</body>
</html>
