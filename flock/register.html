<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — Flock</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-wrap">
        <div class="auth-box">
            <h1>🕊️ Flock</h1>
            <h2>Регистрация</h2>
            <form id="registerForm">
                <input type="text" id="name" placeholder="Имя и фамилия" required>
                <input type="email" id="email" placeholder="Email" required>
                <input type="password" id="password" placeholder="Пароль (минимум 6 символов)" required>
                <button type="submit">Зарегистрироваться</button>
            </form>
            <p><a href="login.html">Уже есть аккаунт? Войти</a></p>
        </div>
    </div>
    <script type="module">
        import { register } from './js/auth.js';

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            try {
                await register(name, email, password);
                alert('✅ Регистрация успешна!');
                window.location.href = 'login.html';
            } catch (error) {
                alert('❌ ' + error.message);
            }
        });
    </script>
</body>
</html>
