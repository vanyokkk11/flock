<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль — Flock</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="wrap">
        <div class="header">
            <div class="logo">🕊️ Flock</div>
            <div class="nav">
                <a href="index.html">Главная</a>
                <a href="profile.html"><b>Мой профиль</b></a>
                <a href="friends.html">Друзья</a>
            </div>
            <div class="user-info">
                <span id="userName">Загрузка...</span>
                <a href="#" onclick="logout()" style="color:#ff8888;">[Выйти]</a>
            </div>
        </div>

        <div class="content">
            <div class="col-left">
                <img src="avatars/default.jpg" width="180" class="avatar" id="userAvatar">
                <br>
                <b id="profileName">Загрузка...</b>
                <br>
                <span id="profileStatus">🟢 Онлайн</span>
                <br>
                <div class="status-display" id="statusDisplay">«Привет, я на Flock!»</div>
            </div>

            <div class="col-center">
                <h2>📝 Мои записи</h2>
                <div id="myPosts"></div>
            </div>

            <div class="col-right">
                <h3>👥 Друзья</h3>
                <div id="myFriends"></div>
            </div>
        </div>
    </div>

    <script type="module">
        import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
        import { doc, getDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
        import { auth, db } from './js/firebase-config.js';
        import { logout } from './js/auth.js';
        import { getMyPosts } from './js/posts.js';
        import { getMyFriends } from './js/friends.js';

        window.logout = logout;

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const userDoc = await getDoc(doc(db, 'users', user.uid));
                const userData = userDoc.data();
                
                document.getElementById('userName').textContent = userData.name;
                document.getElementById('profileName').textContent = userData.name;
                document.getElementById('userAvatar').src = `avatars/${userData.avatar || 'default.jpg'}`;
                document.getElementById('profileStatus').textContent = userData.online ? '🟢 Онлайн' : '⚪ Не в сети';
                document.getElementById('statusDisplay').textContent = `«${userData.status || 'Привет, я на Flock!'}»`;

                getMyPosts(user.uid);
                getMyFriends(user.uid);
            } else {
                window.location.href = 'login.html';
            }
        });
    </script>
</body>
</html>
